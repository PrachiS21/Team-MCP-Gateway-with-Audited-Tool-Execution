[project]
name = "mcp-gateway-backend"
version = "0.1.0"
authors = [{ name = "Prachi" }]
requires-python = ">=3.11"
dependencies = [
    "fastmcp",
    "uvicorn",
    "httpx",
    "sqlalchemy",
    "pydantic",
    "cryptography>=50.0.2",
]

[project.scripts]
gateway = "gateway.__main__:main"
gateway-admin = "gateway.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-timeout>=2.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
