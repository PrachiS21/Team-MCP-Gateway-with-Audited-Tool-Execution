# Keep the WooCommerce consumer key out of Apache's access log.
#
# WooCommerce authenticates REST calls with HTTP Basic auth, and the Basic-auth user name IS the consumer key (ck_...).
# Apache's standard log formats write that user name (%u). These lines redefine the same formats with "-" in its place
# and change nothing else. They keep %a (the visitor's real address): the WordPress image already replaced %h with %a
# for mod_remoteip, and this file must not undo that.
#
# Loaded from /etc/apache2/conf-enabled/, which Debian's apache2.conf reads AFTER its own LogFormat lines and BEFORE
# the site that logs with "combined", so these definitions are the ones used. The secret was never logged.
LogFormat "%v:%p %a %l - %t \"%r\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\"" vhost_combined
LogFormat "%a %l - %t \"%r\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\"" combined
LogFormat "%a %l - %t \"%r\" %>s %O" common
