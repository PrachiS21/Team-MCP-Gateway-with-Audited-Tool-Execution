# Customer messages the Dialogflow CX webhook answered (event "cx_turn", backend/src/gateway/cx.py), by how it went.
description: Dialogflow CX webhook turns, by status
filter: >-
  resource.type="cloud_run_revision" AND resource.labels.service_name="gateway"
  AND jsonPayload.event="cx_turn"
labelExtractors:
  status: EXTRACT(jsonPayload.status)
metricDescriptor:
  metricKind: DELTA
  valueType: INT64
  unit: "1"
  labels:
    - {key: status, valueType: STRING, description: "ok, error, invalid, no_input or unavailable"}
