# Static files only. /api and /mcp never reach this server: the Ingress sends them to the gateway.
# No "single-page app" fallback: the dashboard has no client-side URLs, so an unknown path is a plain 404
# (and /healthz from outside stays a 404, as the cluster tests check).
#
# Security headers are set once, here. Note: an add_header inside a location would REPLACE all of these for that
# location, so the locations below use `expires` (a different directive) for caching instead.
server {
    listen 8080;
    root /usr/share/nginx/html;
    server_tokens off;

    add_header Content-Security-Policy "default-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location = / {
        expires -1;                 # Cache-Control: no-cache, so a new deploy's index.html is picked up at once
        try_files /index.html =404;
    }
    location /assets/ {
        expires 1y;                 # file names contain a content hash, so they never change
        try_files $uri =404;
    }
    location / {
        try_files $uri =404;
    }
}
