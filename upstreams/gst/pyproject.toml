[project]
name = "gst-mcp"
version = "0.1.0"
authors = [{ name = "Prachi" }]
description = "Small MCP server that calculates Indian GST (CGST/SGST or IGST) for amounts"
requires-python = ">=3.11"
dependencies = [
    "fastmcp",
    "uvicorn",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "pytest-timeout", "httpx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gst_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
