[project]
name = "woo-mcp"
version = "0.1.0"
description = "MCP server exposing a WooCommerce store's products and orders as tools"
requires-python = ">=3.11"
dependencies = [
    "fastmcp",
    "httpx",
    "tzdata",   # time zone data for slim container images that have none
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "pytest-timeout", "uvicorn"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/woo_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
